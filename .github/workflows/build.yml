name: Build NaNTube

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Đọc version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk "NaNTube-${{ steps.ver.outputs.version }}.apk"

      - name: Kiểm tra chữ ký
        continue-on-error: true
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose NaNTube-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NaNTube-${{ steps.ver.outputs.version }}
          path: NaNTube-*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: NaNTube ${{ steps.ver.outputs.version }}
          files: NaNTube-*.apk
